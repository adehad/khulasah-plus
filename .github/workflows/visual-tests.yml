name: Visual Tests

on:
  push:
  pull_request:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      # Behavioural specs gate the run (engine-level, OS-independent); the gallery
      # spec captures a full-page screenshot per engine into the HTML report.
      # All projects run in one invocation so the site is built once for the visual and functional suites.
      - name: Run Playwright tests
        run: bunx playwright test

      - name: Run PWA update flow test
        run: bun run test:pwa

      # Expiring artifact — the screenshots to eyeball; uploaded even on failure.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
